# Root Directory trên Railway phải là shoppe-mini
#
# migrate ở release — xong rồi mới nhận traffic.
# Gộp migrate vào start → lúc migrate không có process listen → proxy 502.
[deploy]
releaseCommand = "npx prisma migrate deploy"
startCommand = "node dist/src/main.js"
healthcheckPath = "/"
healthcheckTimeout = 30
