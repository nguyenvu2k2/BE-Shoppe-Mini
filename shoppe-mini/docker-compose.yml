# Local (FE http://localhost:3000). FRONTEND_URL/NODE_ENV bị ghi đè — .env
# có thể giữ URL Vercel cho Railway/prod.
#   docker compose up --build
# Production VPS:
#   docker compose -f docker-compose.prod.yml up -d
# Tắt và xóa container (giữ data):
#   docker compose down
# Xóa luôn volume DB:
#   docker compose down -v
#
# Host Postgres Windows thường chiếm 5432. Map 5433 ra máy
# để Prisma CLI (localhost) không đụng nhầm instance đó.
# Trong mạng Compose, API vẫn nối db:5432.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-shoppe-mini}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-shoppe-mini}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-shoppe-mini}?schema=public
      REDIS_URL: redis://redis:6379
      # Local stack — do not inherit production FRONTEND_URL from .env (CORS + cookies).
      NODE_ENV: development
      PORT: 3001
      FRONTEND_URL: http://localhost:3000
      GOOGLE_CALLBACK_URL: http://localhost:3000/auth/google/callback
      # Image has no .env; this must be in process.env or JwtModule crashes before listen(:3001).
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env next to this compose file}
      VNP_CONFIRM_ON_RETURN: ${VNP_CONFIRM_ON_RETURN:-true}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
